name: CI
on:
  push: { branches: [main] }
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgres://arena_app:arena_app@localhost:5432/arena
  DATABASE_URL_ADMIN: postgres://arena:arena@localhost:5432/arena
  TEST_DATABASE_URL_ADMIN: postgres://arena:arena@localhost:5432/arena_test
  TEST_DATABASE_URL: postgres://arena_app:arena_app@localhost:5432/arena_test
  APP_DB_PASSWORD: arena_app
  REDIS_URL: redis://localhost:6379
  AUTH_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
  AUTH_URL: http://localhost:3000
  ENABLE_DEV_LOGIN: 'true'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18-alpine
        env: { POSTGRES_USER: arena, POSTGRES_PASSWORD: arena, POSTGRES_DB: arena }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U arena" --health-interval 3s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Generate modules + tokens
        run: pnpm gen:modules && pnpm gen:tokens
      - name: Create test database
        run: PGPASSWORD=arena psql -h localhost -U arena -d arena -c 'create database arena_test'
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Migrate + seed
        run: pnpm db:migrate && pnpm seed
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env: { CI: 'true' }
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: playwright-report }
